<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Dashboard - Glassmorphism</title>
  <style>
    /* Styles de base pour structurer la page par-dessus l'animation */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: #fff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Style du Dashboard (Glassmorphism) */
    .dashboard-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      z-index: 10; /* S'assure que le contenu passe bien au-dessus du canvas de fond */
      position: relative;
    }

    /* Sidebar transparente */
    aside {
      width: 260px;
      background: rgba(10, 15, 30, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 30px;
      letter-spacing: 1px;
      color: #79b8ff;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-links li a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 6px;
      display: block;
      transition: all 0.2s ease;
    }

    .nav-links li a:hover, .nav-links li a.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Contenu principal */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
    }

    header {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 25px;
    }

    /* Grille de cartes */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card h3 {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 10px;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    /* Panneau de contenu étendu */
    .panel {
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 20px;
      flex: 1;
    }

    .panel h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <!-- Layout du Dashboard -->
  <div class="dashboard-layout">
    <aside>
      <div class="logo">TREVYN — XMB</div>
      <ul class="nav-links">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="#">Clients</a></li>
        <li><a href="#">Builder</a></li>
        <li><a href="#">Operators</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <main>
      <header>Vue d'ensemble</header>

      <div class="cards-grid">
        <div class="card">
          <h3>Connexions Actives</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Tâches en file</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Requêtes / min</h3>
          <div class="value">142</div>
        </div>
        <div class="card">
          <h3>Disponibilité</h3>
          <div class="value">99.9%</div>
        </div>
      </div>

      <div class="panel">
        <h2>Journal d'activité en temps réel</h2>
        <p style="color: rgba(255,255,255,0.4); font-size: 0.9rem;">En attente de flux de données...</p>
      </div>
    </main>
  </div>

  <!-- Branchement de ton script d'animation en arrière-plan -->
  <script src="script.js" defer></script>
</body>
</html>
