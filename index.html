<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trevyn — XMB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .dashboard-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 10;
    }

    /* Sidebar avec gestion du responsive et du collapse mobile */
    aside {
      width: 260px;
      background: rgba(15, 15, 15, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 25px 20px;
      transition: transform 0.3s ease-in-out;
      z-index: 20;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 35px;
      letter-spacing: 1px;
      color: #fff;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-links li a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      display: block;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-links li a:hover, .nav-links li a.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Contenu principal */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 35px;
      overflow-y: auto;
    }

    /* Bouton Hamburger pour mobile (masqué sur grand écran) */
    .menu-toggle {
      display: none;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 20px;
      align-self: flex-start;
    }

    header {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 25px;
      color: rgba(255, 255, 255, 0.9);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card h3 {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .panel {
      background: rgba(20, 20, 20, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 25px;
      flex: 1;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    /* Media Queries pour Mobile */
    @media (max-width: 768px) {
      aside {
        position: fixed;
        height: 100%;
        transform: translateX(-100%);
      }
      aside.open {
        transform: translateX(0);
      }
      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="logo">Trevyn — XMB</div>
      <ul class="nav-links">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="#">Clients</a></li>
        <li><a href="#">Builder</a></li>
        <li><a href="#">Operators</a></li>
      </ul>
    </aside>

    <!-- Contenu principal -->
    <main>
      <!-- Bouton pour ouvrir/fermer sur mobile -->
      <button class="menu-toggle" id="menuToggle">☰ Menu</button>
      
      <header>Dashboard</header>

      <div class="cards-grid">
        <div class="card">
          <h3>Total Clients</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Active Sessions</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Queue Tasks</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>System Status</h3>
          <div class="value" style="font-size: 1.2rem; color: #fff; margin-top: 6px;">Online</div>
        </div>
      </div>

      <div class="panel">
        <h2>Activité récente</h2>
        <p style="color: rgba(255,255,255,0.4); font-size: 0.85rem;">Prêt pour intégration...</p>
      </div>
    </main>
  </div>

  <!-- Script minimal pour gérer l'ouverture/fermeture de la sidebar mobile -->
  <script>
    const toggleBtn = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Fermer la sidebar si on clique en dehors sur mobile
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && !sidebar.contains(e.target) && e.target !== toggleBtn) {
        sidebar.classList.remove('open');
      }
    });
  </script>

  <!-- Branche ton script d'animation de vagues ici -->
  <script src="script.js" defer></script>
</body>
</html>
