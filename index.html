<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trevyn — XMB</title>
  <style>
    /* Styles globaux */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100vh;
      overflow: hidden;
      background: #020812;
      color: #fff;
    }

    /* Layout principal du Dashboard */
    .dashboard-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
      z-index: 10; /* S'assure que le contenu passe bien par-dessus ton script d'arrière-plan */
    }

    /* Sidebar transparente (Glassmorphism) */
    aside {
      width: 260px;
      background: rgba(10, 15, 30, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 25px 20px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 35px;
      letter-spacing: 1px;
      color: #e2e8f0;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-links li a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      display: block;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-links li a:hover, .nav-links li a.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Contenu principal */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 35px;
      overflow-y: auto;
    }

    header {
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 25px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Grille de cartes statistiques (Glassmorphism) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card h3 {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 600;
    }

    /* Panneau principal de contenu (Glassmorphism) */
    .panel {
      background: rgba(15, 23, 42, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 25px;
      flex: 1;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .panel h2 {
      font-size: 1rem;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Structure du Dashboard -->
  <div class="dashboard-layout">
    <aside>
      <div class="logo">Trevyn — XMB</div>
      <ul class="nav-links">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="#">Clients</a></li>
        <li><a href="#">Builder</a></li>
        <li><a href="#">Operators</a></li>
      </ul>
    </aside>

    <main>
      <header>Dashboard</header>

      <div class="cards-grid">
        <div class="card">
          <h3>Total Clients</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Active Sessions</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>Queue Tasks</h3>
          <div class="value">0</div>
        </div>
        <div class="card">
          <h3>System Status</h3>
          <div class="value" style="font-size: 1.2rem; color: #4ade80; margin-top: 6px;">Online</div>
        </div>
      </div>

      <div class="panel">
        <h2>Activité récente</h2>
        <p style="color: rgba(255,255,255,0.4); font-size: 0.85rem;">Aucun événement récent enregistré...</p>
      </div>
    </main>
  </div>

  <!-- Branchement de ton fichier script.js externe pour l'animation en arrière-plan -->
  <script src="script.js" defer></script>
</body>
</html>
